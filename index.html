<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mars Canyon - Free First-Person Action Game</title>

    <meta name="description" content="Play Mars Canyon, a free first-person action game set on Mars. Avoid enemy drones and get back to your mothership in this free browser-based Unity game.">

    <meta name="keywords" content="Mars Canyon, free online games, free browser games, first person action game, Mars game, space games, Unity WebGL games, exploration games, sci-fi games">

    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Mars Canyon - Free First-Person Action Game">
    <meta property="og:description" content="Avoid the enemy drones and get back to your mothership in this free first-person action adventure.">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">

    <script src="TemplateData/UnityProgress.js"></script>

    <style>

        body {
            margin: 0;
            background: #171717;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #landing {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        /* MAIN IMAGE */

        .hero-frame {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
        }

        .hero-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CINEMATIC VIGNETTE */

        .hero-frame::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 45%,
                rgba(0, 0, 0, 0.12) 75%,
                rgba(0, 0, 0, 0.55) 100%
            );
        }

        .description {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 30px;
        }

        .controls {
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .game-description {
            color: #aaa;
            max-width: 550px;
            line-height: 1.7;
            margin: 25px auto;
        }

        /* PLAY BUTTON */

        .play-button {
            display: inline-block;
            padding: 16px 40px;
            background: #a71924;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
        }

        .play-button:hover {
            background: #cf2633;
        }

        /* UNITY GAME */

        #game {
            display: none;
            padding-top: 20px;
        }

        #game .template-wrap {
            margin: auto;
        }

        #game canvas {
            max-width: 100%;
        }

        .back-link {
            display: inline-block;
            margin: 15px;
            color: #ccc;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }

        @media (max-width: 600px) {

            .description {
                font-size: 18px;
            }

            .hero-frame {
                max-width: 100%;
            }

        }

    </style>
</head>

<body>

<!-- LANDING PAGE -->

<div id="landing">

    <div class="hero-frame">

        <img
            src="splash_screen_04.png"
            class="hero-image"
            alt="Mars Canyon - A spacecraft exploring a Martian canyon"
        >

    </div>

    <p class="description">
        A first-person action game.
    </p>

    <div class="controls">
        <strong>CONTROLS</strong><br>
        Move: Arrow keys<br>
        Look: Mouse<br>
        No jumping or shooting required.
    </div>

    <a class="play-button" href="#play"
       onclick="startGame(); return false;">
        PLAY MARS CANYON
    </a>

    <p class="game-description">
        Avoid the enemy drones and get back to your
        mothership.
    </p>
    <p style="color: #aaa; margin-top: 35px;">
    <a href="mailto:beythemou@gmail.com"
       style="color: #ccc; text-decoration: none;">
        &#9993; Contact us: beythemou@gmail.com
    </a>
</p>

</div>


<!-- UNITY GAME -->

<div id="game">

    <a href="#" class="back-link"
       onclick="return showLanding()">
        &larr; Back to main page
    </a>

    <div class="template-wrap clear">

        <canvas class="emscripten" id="canvas"
            oncontextmenu="event.preventDefault()"
            height="600" width="960">
        </canvas>

        <div class="logo"></div>

        <div class="fullscreen">
            <img src="TemplateData/fullscreen.png"
                width="38" height="38"
                alt="Fullscreen"
                title="Fullscreen"
                onclick="SetFullscreen(1);" />
        </div>

        <div class="title">Mars Canyon</div>

    </div>

</div>


<script>

var gameStarted = false;

function startGame() {

    document.getElementById("landing").style.display = "none";
    document.getElementById("game").style.display = "block";

    if (!gameStarted) {
        gameStarted = true;
        loadUnity();
    }
}

function showLanding() {

    document.getElementById("game").style.display = "none";
    document.getElementById("landing").style.display = "flex";

    return false;
}

function loadUnity() {

    var Module = {
        TOTAL_MEMORY: 268435456,
        filePackagePrefixURL: "Release/",
        memoryInitializerPrefixURL: "Release/",
        preRun: [],
        postRun: [],

        print: function(text) {
            console.log(text);
        },

        printErr: function(text) {
            console.error(text);
        },

        canvas: document.getElementById('canvas'),
        progress: null,

        setStatus: function(text) {

            if (this.progress == null) {
                if (typeof UnityProgress != 'function')
                    return;

                this.progress = new UnityProgress(this.canvas);
            }

            if (!Module.setStatus.last)
                Module.setStatus.last = { time: Date.now(), text: '' };

            if (text === Module.setStatus.text) return;

            this.progress.SetMessage(text);

            var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);

            if (m)
                this.progress.SetProgress(parseInt(m[2])/parseInt(m[4]));

            if (text === "")
                this.progress.Clear();
        },

        totalDependencies: 0,

        monitorRunDependencies: function(left) {

            this.totalDependencies = Math.max(this.totalDependencies, left);

            Module.setStatus(
                left ?
                'Preparing... (' +
                (this.totalDependencies-left) + '/' +
                this.totalDependencies + ')' :
                'All downloads complete.'
            );
        }
    };

    Module.setStatus('Downloading (0.0/1)');

    window.Module = Module;

    var config = document.createElement('script');
    config.src = "Release/UnityConfig.js";
    document.body.appendChild(config);

    var loader = document.createElement('script');
    loader.src = "Release/fileloader.js";
    document.body.appendChild(loader);

    var script = document.createElement('script');

    if (!(!Math.fround)) {

        script.src = "Release/WebGame.js";
        document.body.appendChild(script);

    } else {

        var codeXHR = new XMLHttpRequest();

        codeXHR.open('GET', 'Release/WebGame.js', true);

        codeXHR.onload = function() {

            var code = codeXHR.responseText;

            if (!Math.fround) {
                try {
                    console.log('optimizing out Math.fround calls');

                    var m = /var ([^=]+)=global\.Math\.fround;/.exec(code);
                    var minified = m[1];

                    if (!minified) throw 'fail';

                    var startAsm = code.indexOf('// EMSCRIPTEN_START_FUNCS');
                    var endAsm = code.indexOf('// EMSCRIPTEN_END_FUNCS');

                    var asm = code.substring(startAsm, endAsm);

                    do {
                        var moar = false;

                        asm = asm.replace(
                            new RegExp('[^a-zA-Z0-9\\$\\_]' + minified + '\\(', 'g'),
                            function(s) {
                                moar = true;
                                return s[0] + '(';
                            }
                        );

                    } while (moar);

                    code = code.substring(0, startAsm) +
                        asm + code.substring(endAsm);

                    code = code.replace("'use asm'", "'almost asm'");

                } catch(e) {
                    console.log('failed to optimize out Math.fround calls ' + e);
                }
            }

            var blob = new Blob([code], {
                type: 'text/javascript'
            });

            var src = URL.createObjectURL(blob);
            script.src = src;

            script.onload = function() {
                URL.revokeObjectURL(src);
            };

            document.body.appendChild(script);
        };

        codeXHR.send(null);
    }
}

</script>

</body>
</html>
